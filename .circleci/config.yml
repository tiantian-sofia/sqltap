version: 2.1
jobs:
    tox_block:
        parameters:
            python_version:
                type: string
            tox_env:
                type: string
        docker:
            - image: "python:<< parameters.python_version >>"
        steps:
            - checkout

            - run:
                name: install tox and upgrade pip
                command: pip install --progress-bar off -U pip tox

            - run:
                name: version checks
                command: |
                    python --version
                    pip --version
                    virtualenv --version
                    tox --version

            - run:
                name: run tox
                command: "tox -e << parameters.tox_env >>"

            - store_test_results:
                path: .circleci/test-reports/
workflows:
    version: 2
    build:
        jobs:
            - tox_block:
                python_version: "3.14"
                tox_env: py314,flake8
            - tox_block:
                python_version: "3.13"
                tox_env: py313
            - tox_block:
                python_version: "3.12"
                tox_env: py312
            - tox_block:
                python_version: "3.11"
                tox_env: py311
            - tox_block:
                python_version: "3.10"
                tox_env: py310,py310-lowest
